<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Drone Collision Simulator — Phase 3A viewer</title>
<style>
  :root {
    --surface:    #1a1a19;
    --page:       #0d0d0d;
    --ink:        #ffffff;
    --ink-2:      #c3c2b7;
    --muted:      #898781;
    --gridline:   #2c2c2a;
    --baseline:   #383835;
    --border:     rgba(255,255,255,0.10);
    --danger:     #ff3b3b;
  }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page); color: var(--ink);
    margin: 0; padding: 20px 24px 28px;
  }
  h1 {
    font-size: 1.15rem; font-weight: 600; text-align: center;
    margin: 0 0 16px;
  }
  #controls {
    display: flex; flex-wrap: wrap; gap: 14px; align-items: end;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 14px; margin: 0 auto 18px; max-width: 900px;
  }
  #controls label {
    font-size: 0.72rem; color: var(--muted); display: flex; flex-direction: column; gap: 3px;
  }
  #controls input {
    width: 78px; background: #101010; color: var(--ink); border: 1px solid var(--border);
    border-radius: 4px; padding: 3px 6px; font-size: 0.85rem;
  }
  #controls input:focus { outline: 1px solid var(--muted); }
  button {
    cursor: pointer; padding: 5px 12px; font-size: 0.82rem;
    background: #262625; color: var(--ink); border: 1px solid var(--border); border-radius: 5px;
  }
  button:hover { background: #313130; }

  #plotRow { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; }
  #plotWrap { position: relative; }
  canvas#canvas { background: var(--surface); border-radius: 4px; display: block; }

  .overlay-box {
    position: absolute; font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
    font-size: 0.72rem; line-height: 1.5; white-space: pre; pointer-events: none;
  }
  #statOverlay {
    top: 20px; left: 64px;
    background: rgba(0,0,0,0.55); color: var(--ink); border-radius: 5px; padding: 8px 10px;
  }
  #legendBox {
    top: 20px; right: 20px;
    background: rgba(252,252,251,0.92); color: #0b0b0b; border: 1px solid rgba(11,11,11,0.3);
    border-radius: 4px; padding: 4px 9px; font-family: system-ui, sans-serif; font-size: 0.78rem;
  }
  .marker-x { color: var(--danger); font-weight: 700; margin-right: 4px; }

  #colorbarWrap { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  #cbMax, #cbMin {
    font-family: ui-monospace, monospace; font-size: 0.72rem; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  #cbLabel {
    font-size: 0.68rem; color: var(--muted); max-width: 60px; text-align: center; margin-top: 2px;
  }
  canvas#colorbar { border-radius: 3px; border: 1px solid var(--border); }

  details#detailsBlock {
    max-width: 900px; margin: 16px auto 0; color: var(--ink-2); font-size: 0.78rem;
  }
  details#detailsBlock summary {
    cursor: pointer; color: var(--muted); font-size: 0.78rem; user-select: none;
  }
  #stats {
    font-family: ui-monospace, monospace; font-size: 0.78rem; white-space: pre; margin-top: 8px;
    color: var(--ink-2);
  }
  #error {
    color: var(--danger); font-family: ui-monospace, monospace; white-space: pre-wrap;
    margin-top: 12px; max-width: 900px; margin-left: auto; margin-right: auto; text-align: center;
  }
</style>
</head>
<body>
<h1>Drone Collision Simulator</h1>
<div id="controls">
  <label>x_min <input id="x_min" type="number" value="0"></label>
  <label>x_max <input id="x_max" type="number" value="500"></label>
  <label>y_min <input id="y_min" type="number" value="0"></label>
  <label>y_max <input id="y_max" type="number" value="500"></label>
  <label>z_min <input id="z_min" type="number" placeholder="(none)"></label>
  <label>z_max <input id="z_max" type="number" placeholder="(none)"></label>
  <label>num_drones <input id="num_drones" type="number" value="2000"></label>
  <button id="apply">Apply / New simulation</button>
  <button id="pauseResume">Pause</button>
  <button id="step">Step</button>
  <button id="reset">Reset</button>
</div>
<div id="plotRow">
  <div id="plotWrap">
    <canvas id="canvas"></canvas>
    <div id="statOverlay" class="overlay-box">connecting...</div>
    <div id="legendBox" class="overlay-box"><span class="marker-x">✕</span>collision</div>
  </div>
  <div id="colorbarWrap">
    <div id="cbMax">0</div>
    <canvas id="colorbar" width="26" height="500"></canvas>
    <div id="cbMin">0</div>
    <div id="cbLabel">drones / cell (density)</div>
  </div>
</div>
<details id="detailsBlock">
  <summary>timings &amp; advanced metrics</summary>
  <div id="stats"></div>
</details>
<div id="error"></div>

<script>
// Poll roughly 6-7x/sec (within the 5-10 Hz spec) but never start a new
// /frame request while the previous one is still in flight -- otherwise a
// slow request (e.g. server under load) causes requests to pile up and
// overlap, wasting server time and worsening the exact problem being polled
// for. See README's "Phase 3A tick-rate regression" section.
const REFRESH_INTERVAL_MS = 150;

// Plot layout: a left/bottom tick margin around a square data area, mirroring
// the Matplotlib debug viewer's look (axes + colorbar + legend in one image)
// instead of a bare canvas next to a separate wall of text.
const MARGIN = { left: 56, right: 12, top: 12, bottom: 38 };
const PLOT_SIZE = 600;

const state = { simulationId: null, paused: false, timer: null, requestInFlight: false };
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const errorEl = document.getElementById("error");
const statsEl = document.getElementById("stats");
const statOverlayEl = document.getElementById("statOverlay");
const cbMaxEl = document.getElementById("cbMax");

canvas.width = MARGIN.left + PLOT_SIZE + MARGIN.right;
canvas.height = MARGIN.top + PLOT_SIZE + MARGIN.bottom;

function showError(msg) { errorEl.textContent = msg; }
function clearError() { errorEl.textContent = ""; }

function bounds() {
  const num = (id) => {
    const v = document.getElementById(id).value;
    return v === "" ? null : Number(v);
  };
  return {
    x_min: num("x_min"), x_max: num("x_max"),
    y_min: num("y_min"), y_max: num("y_max"),
    z_min: num("z_min"), z_max: num("z_max"),
  };
}

async function api(path, options) {
  const res = await fetch(path, options);
  if (!res.ok) {
    const body = await res.text();
    throw new Error(`${res.status} ${path}: ${body}`);
  }
  return res.json();
}

function qs(params) {
  const usp = new URLSearchParams();
  for (const [k, v] of Object.entries(params)) {
    if (v !== null && v !== undefined) usp.set(k, v);
  }
  return usp.toString();
}

// Key for persisting the active simulation_id across page reloads, so a
// reload can stop the PREVIOUS page load's simulation before starting a new
// one -- otherwise every reload orphans another live background thread that
// runs forever (SimulationRuntime's loop only exits on shutdown()), each one
// competing for the same CPU/GIL as whichever simulation is actually being
// viewed. See README's "Orphaned runtime threads" section.
const SIMULATION_ID_STORAGE_KEY = "drone_sim_active_simulation_id";

async function stopSimulationIfAny(simulationId) {
  if (!simulationId) return;
  try {
    await fetch(`/simulations/${simulationId}`, { method: "DELETE" });
  } catch (err) {
    // Best-effort: a 404 (already gone) or network hiccup here must never
    // block creating the replacement simulation.
  }
}

async function createSimulation() {
  // Stop whatever simulation this browser tab (or a previous load of it) was
  // last pointed at -- both the "Apply / New simulation" button (state.simulationId
  // already set) and a fresh page load after a previous session (persisted in
  // sessionStorage) leak an orphaned background thread otherwise.
  await stopSimulationIfAny(state.simulationId || sessionStorage.getItem(SIMULATION_ID_STORAGE_KEY));

  const b = bounds();
  const num_drones = Number(document.getElementById("num_drones").value) || 2000;
  const width = (b.x_max ?? 500) - (b.x_min ?? 0);
  const height = (b.y_max ?? 500) - (b.y_min ?? 0);
  const resp = await api("/simulations", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ num_drones, bounds_max: [Math.max(width, 1), Math.max(height, 1), 100] }),
  });
  state.simulationId = resp.simulation_id;
  sessionStorage.setItem(SIMULATION_ID_STORAGE_KEY, resp.simulation_id);
  await api(`/simulations/${state.simulationId}/start`, { method: "POST" });
  state.paused = false;
  document.getElementById("pauseResume").textContent = "Pause";
}

async function togglePauseResume() {
  if (!state.simulationId) return;
  const action = state.paused ? "resume" : "pause";
  await api(`/simulations/${state.simulationId}/${action}`, { method: "POST" });
  state.paused = !state.paused;
  document.getElementById("pauseResume").textContent = state.paused ? "Resume" : "Pause";
}

async function stepOnce() {
  if (!state.simulationId) return;
  if (!state.paused) await togglePauseResume();
  await api(`/simulations/${state.simulationId}/step`, { method: "POST" });
  await refresh();
}

async function resetSimulation() {
  if (!state.simulationId) return;
  await api(`/simulations/${state.simulationId}/reset`, { method: "POST" });
  await refresh();
}

// Approximates Matplotlib's "inferno" colormap (the GUI viewer's cmap="inferno"
// in visualization.py) so the two tools read as the same visual language
// instead of two unrelated color schemes for what can be the same simulation.
const INFERNO_STOPS = [
  [0.00, 0x00, 0x00, 0x04],
  [0.13, 0x1b, 0x0c, 0x42],
  [0.25, 0x4b, 0x0c, 0x6b],
  [0.38, 0x78, 0x1c, 0x6d],
  [0.50, 0xa5, 0x2c, 0x60],
  [0.63, 0xcf, 0x44, 0x46],
  [0.75, 0xed, 0x69, 0x25],
  [0.88, 0xfb, 0x9a, 0x06],
  [1.00, 0xfc, 0xff, 0xa4],
];
function infernoColor(t) {
  t = Math.min(1, Math.max(0, t));
  for (let i = 0; i < INFERNO_STOPS.length - 1; i++) {
    const [t0, r0, g0, b0] = INFERNO_STOPS[i];
    const [t1, r1, g1, b1] = INFERNO_STOPS[i + 1];
    if (t >= t0 && t <= t1) {
      const f = (t - t0) / (t1 - t0 || 1);
      return `rgb(${Math.round(r0 + (r1 - r0) * f)},${Math.round(g0 + (g1 - g0) * f)},${Math.round(b0 + (b1 - b0) * f)})`;
    }
  }
  const [, r, g, b] = INFERNO_STOPS[INFERNO_STOPS.length - 1];
  return `rgb(${r},${g},${b})`;
}

function renderColorbar() {
  const cb = document.getElementById("colorbar");
  const cctx = cb.getContext("2d");
  const grad = cctx.createLinearGradient(0, 0, 0, cb.height);
  for (let i = 0; i <= 20; i++) grad.addColorStop(i / 20, infernoColor(1 - i / 20));
  cctx.fillStyle = grad;
  cctx.fillRect(0, 0, cb.width, cb.height);
}

function axisTicks(min, max, n = 5) {
  const ticks = [];
  for (let i = 0; i < n; i++) ticks.push(min + (i * (max - min)) / (n - 1));
  return ticks;
}
function fmtTick(v) {
  return Number.isInteger(v) ? String(v) : v.toFixed(1);
}

function renderHeatmap(hm) {
  const { left, top } = MARGIN;
  const cellW = PLOT_SIZE / hm.x_bins;
  const cellH = PLOT_SIZE / hm.y_bins;
  const max = Math.max(hm.max_density, 1);
  for (let row = 0; row < hm.y_bins; row++) {
    for (let col = 0; col < hm.x_bins; col++) {
      const t = hm.counts[row][col] / max;
      ctx.fillStyle = infernoColor(t);
      // canvas y grows downward; flip so row 0 (y_min) draws at the bottom.
      const y = top + PLOT_SIZE - (row + 1) * cellH;
      ctx.fillRect(left + col * cellW, y, cellW + 0.5, cellH + 0.5);
    }
  }
  cbMaxEl.textContent = hm.max_density.toLocaleString();
}

function renderAxes(b) {
  const { left, top, bottom } = MARGIN;
  const plotBottom = top + PLOT_SIZE;
  const plotRight = left + PLOT_SIZE;

  ctx.strokeStyle = "#383835"; // --baseline
  ctx.fillStyle = "#898781";   // --muted
  ctx.font = "11px system-ui, sans-serif";
  ctx.lineWidth = 1;

  ctx.beginPath();
  ctx.moveTo(left, plotBottom + 0.5);
  ctx.lineTo(plotRight, plotBottom + 0.5);
  ctx.moveTo(left - 0.5, top);
  ctx.lineTo(left - 0.5, plotBottom);
  ctx.stroke();

  const xTicks = axisTicks(b.x_min ?? 0, b.x_max ?? 1);
  ctx.textAlign = "center";
  ctx.textBaseline = "top";
  xTicks.forEach((v, i) => {
    const px = left + (i * PLOT_SIZE) / (xTicks.length - 1);
    ctx.beginPath();
    ctx.moveTo(px, plotBottom);
    ctx.lineTo(px, plotBottom + 5);
    ctx.stroke();
    ctx.fillText(fmtTick(v), px, plotBottom + 8);
  });

  const yTicks = axisTicks(b.y_min ?? 0, b.y_max ?? 1);
  ctx.textAlign = "right";
  ctx.textBaseline = "middle";
  yTicks.forEach((v, i) => {
    const py = plotBottom - (i * PLOT_SIZE) / (yTicks.length - 1);
    ctx.beginPath();
    ctx.moveTo(left - 5, py);
    ctx.lineTo(left, py);
    ctx.stroke();
    ctx.fillText(fmtTick(v), left - 8, py);
  });
}

function renderCollisions(markers, b) {
  const { left, top } = MARGIN;
  const spanX = (b.x_max - b.x_min) || 1;
  const spanY = (b.y_max - b.y_min) || 1;
  ctx.strokeStyle = "#ff3b3b";
  ctx.lineWidth = 2;
  for (const m of markers) {
    const px = left + ((m.x - b.x_min) / spanX) * PLOT_SIZE;
    const py = top + PLOT_SIZE - ((m.y - b.y_min) / spanY) * PLOT_SIZE;
    ctx.beginPath();
    ctx.moveTo(px - 5, py - 5); ctx.lineTo(px + 5, py + 5);
    ctx.moveTo(px + 5, py - 5); ctx.lineTo(px - 5, py + 5);
    ctx.stroke();
  }
}

async function refresh() {
  if (!state.simulationId) return;
  // Guard against overlapping requests: if the previous /frame call hasn't
  // returned yet, skip this tick of the poll timer rather than starting a
  // second concurrent request.
  if (state.requestInFlight) return;
  state.requestInFlight = true;

  const b = bounds();
  const params = {
    x_min: b.x_min ?? 0, x_max: b.x_max ?? 500, y_min: b.y_min ?? 0, y_max: b.y_max ?? 500,
    x_bins: 60, y_bins: 60,
  };
  if (b.z_min !== null) params.z_min = b.z_min;
  if (b.z_max !== null) params.z_max = b.z_max;

  try {
    // One combined request -- one snapshot read server-side -- instead of
    // four separate round trips, so every field below describes the same tick.
    const frame = await api(`/simulations/${state.simulationId}/frame?${qs(params)}`);
    clearError();

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (frame.num_visible_drones > 0) renderHeatmap(frame.heatmap);
    else cbMaxEl.textContent = "0";
    renderAxes(params);
    renderCollisions(frame.markers, params);

    const m = frame.metrics || {};
    const t = frame.timings || {};
    // "collision markers" (this tick, viewport-filtered) vs "collisions"
    // (cumulative since the simulation started) are genuinely different
    // numbers -- kept clearly labeled and separated so they're never
    // mistaken for the same metric (see RemoteSimulationViewer, which
    // mirrors this exact layout for the Matplotlib --remote viewer).
    statOverlayEl.textContent = [
      `sim: ${state.simulationId}`,
      `status: ${frame.status}    tick: ${frame.tick}`,
      `drones in viewport: ${frame.num_visible_drones.toLocaleString()}`,
      `collision markers: ${frame.markers.length}`,
      `ticks/sec: ${(m.ticks_per_second ?? 0).toFixed(1)}`,
      `-- cumulative --`,
      `collisions: ${(m.total_collisions ?? 0).toLocaleString()}`,
      `near misses: ${(m.total_near_misses ?? 0).toLocaleString()}`,
    ].join("\n");

    statsEl.textContent = [
      `mean tick ms (sim.step only): ${(m.mean_tick_ms ?? 0).toFixed(3)}`,
      `-- last-tick timings (ms) --`,
      `sim_step: ${(t.sim_step_ms ?? 0).toFixed(3)}  snapshot_build: ${(t.snapshot_build_ms ?? 0).toFixed(3)}`,
      `lock_wait: ${(t.lock_wait_ms ?? 0).toFixed(3)}  heatmap: ${(t.heatmap_ms ?? 0).toFixed(3)}`,
      `collisions: ${(t.collisions_ms ?? 0).toFixed(3)}  serialize: ${(t.serialization_ms ?? 0).toFixed(3)}`,
      `total_request: ${(t.total_request_ms ?? 0).toFixed(3)}`,
    ].join("\n");
  } catch (err) {
    showError(String(err));
  } finally {
    state.requestInFlight = false;
  }
}

document.getElementById("apply").addEventListener("click", async () => {
  try { await createSimulation(); clearError(); } catch (err) { showError(String(err)); }
});
document.getElementById("pauseResume").addEventListener("click", () => togglePauseResume().catch((e) => showError(String(e))));
document.getElementById("step").addEventListener("click", () => stepOnce().catch((e) => showError(String(e))));
document.getElementById("reset").addEventListener("click", () => resetSimulation().catch((e) => showError(String(e))));

renderColorbar();
renderAxes(bounds());

(async function init() {
  try {
    // A ?simulation_id= URL param means "join" rather than "create" -- e.g.
    // scripts/run_visualizer.py --remote prints a URL like this after
    // creating its own simulation, so the browser and the Matplotlib window
    // display the exact same live simulation instead of each getting its own.
    // Falls through to the normal createSimulation() flow if the id turns
    // out to be gone (404 on the first /frame poll shows as a normal error).
    const joinParams = new URLSearchParams(window.location.search);
    const joinId = joinParams.get("simulation_id");
    if (joinId) {
      state.simulationId = joinId;
      sessionStorage.setItem(SIMULATION_ID_STORAGE_KEY, joinId);
      // Also sync the viewport inputs to the joined viewer's own viewport
      // (see RemoteSimulationViewer.join_url()) -- otherwise these stay at
      // their hardcoded 0-500 defaults and this tab can query a different
      // window than the one that created the link, showing a different
      // collision count for what looks like "the same" simulation.
      for (const key of ["x_min", "x_max", "y_min", "y_max"]) {
        const v = joinParams.get(key);
        if (v !== null) document.getElementById(key).value = v;
      }
      clearError();
    } else {
      await createSimulation();
    }
  } catch (err) {
    showError(String(err));
  }
  state.timer = setInterval(refresh, REFRESH_INTERVAL_MS);
})();
</script>
</body>
</html>
