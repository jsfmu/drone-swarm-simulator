# Minimal static-file server for the Vite production build. One HTML page
# today (no client-side router), so this is mostly a sane baseline plus a
# fallback that stays correct if routing is ever added later.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints filenames in dist/assets/*, so they're safe to cache
    # aggressively; index.html itself is left at nginx's default (no-cache)
    # so a new deploy is always picked up on next load.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
